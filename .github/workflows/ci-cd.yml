name: CI/CD Pipeline - Churn Prediction

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Continuous Integration (Lint & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest flake8

      - name: Análisis estático de código (Lint)
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar Suite de Tests
        env:
          PYTHONPATH: app
          MODEL_PATH: model/1/model.pkl
          MODEL_VERSIONS_DIR: model
          ALLOW_FALLBACK_MODEL: "true"
        run: |
          pytest app/tests/ -v

  deploy:
    name: Continuous Deployment (VPS)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue automático en el VPS..."
            cd /root/trabajo-machine-learning
            git pull origin main
            docker compose build app
            docker compose up -d --no-deps app
            echo "✅ Despliegue completado exitosamente."
