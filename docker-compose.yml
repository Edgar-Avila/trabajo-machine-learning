services:
  db_seed:
    build:
      context: ./ml
      dockerfile: Dockerfile
    volumes:
      - ./data:/data:ro
      - ./db:/db
    command: python seed.py --data /data/customer_churn_dataset-testing-master.csv --db /db/churn.db --max-rows 20000

  ingest:
    build:
      context: ./ml
      dockerfile: Dockerfile
    depends_on:
      db_seed:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./db:/db
    command: python ingest.py --data /data/customer_churn_dataset-testing-master.csv --db /db/churn.db --interval 300
    restart: unless-stopped

  scheduler:
    build:
      context: ./ml
      dockerfile: Dockerfile
    depends_on:
      db_seed:
        condition: service_completed_successfully
    volumes:
      - ./db:/db
      - ./model:/opt/model
    command: python scheduler.py --db /db/churn.db --model-dir /opt/model --interval 43200
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      scheduler:
        condition: service_started
    volumes:
      - ./model:/opt/model
      - ./db:/db
    environment:
      - PORT=8000
      - MODEL_PATH=/opt/model/model.pkl
      - MODEL_VERSIONS_DIR=/opt/model
      - DB_PATH=/db/churn.db
      - ALLOW_FALLBACK_MODEL=false
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "${CADDY_LISTEN:-127.0.0.1}:80:80"
      - "${CADDY_LISTEN:-127.0.0.1}:443:443"
    environment:
      - DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: