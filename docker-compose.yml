services:
  db_seed:
    build:
      context: ./ml
      dockerfile: Dockerfile
    volumes:
      - ./data:/data:ro
      - ./db:/db
    command: python seed.py --data /data/customer_churn_dataset-testing-master.csv --db /db/churn.db --max-rows 20000

  ingest:
    build:
      context: ./ml
      dockerfile: Dockerfile
    depends_on:
      db_seed:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./db:/db
    command: python ingest.py --data /data/customer_churn_dataset-testing-master.csv --db /db/churn.db --interval 300
    restart: unless-stopped

  scheduler:
    build:
      context: ./ml
      dockerfile: Dockerfile
    depends_on:
      db_seed:
        condition: service_completed_successfully
    volumes:
      - ./db:/db
      - ./model:/opt/model
    command: python scheduler.py --db /db/churn.db --model-dir /opt/model --interval 43200
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      scheduler:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./model:/opt/model
      - ./db:/db
    environment:
      - PORT=8000
      - MODEL_PATH=/opt/model/model.pkl
      - MODEL_VERSIONS_DIR=/opt/model
      - DB_PATH=/db/churn.db
      - ALLOW_FALLBACK_MODEL=false
    restart: unless-stopped