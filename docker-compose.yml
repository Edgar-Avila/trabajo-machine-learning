services:
  db_seed:
    build:
      context: ./ml
      dockerfile: Dockerfile
    volumes:
      - ./data:/data:ro
      - ./db:/db
    command: python seed.py --data /data/customer_churn_dataset-testing-master.csv --db /db/churn.db --max-rows 2000

  train:
    build:
      context: ./ml
      dockerfile: Dockerfile
    depends_on:
      db_seed:
        condition: service_completed_successfully
    volumes:
      - ./db:/db
      - ./model:/opt/model
    command: python train.py --db /db/churn.db --output /opt/model --max-rows 2000

  predict:
    build:
      context: ./ml
      dockerfile: Dockerfile
    depends_on:
      train:
        condition: service_completed_successfully
    volumes:
      - ./db:/db
      - ./model:/opt/model
    command: python predict.py --db /db/churn.db --model-dir /opt/model

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      predict:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./model:/opt/model
      - ./db:/db
    environment:
      - PORT=8000
      - MODEL_PATH=/opt/model/model.pkl
      - MODEL_VERSIONS_DIR=/opt/model
      - DB_PATH=/db/churn.db
      - ALLOW_FALLBACK_MODEL=false